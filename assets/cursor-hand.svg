<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gloveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="55%" stop-color="#f3e5cc"/>
      <stop offset="100%" stop-color="#cfb893"/>
    </linearGradient>
    <linearGradient id="cuffGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4793c"/>
      <stop offset="100%" stop-color="#6b4018"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#140c06" flood-opacity="0.65"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <!-- Ornate brown & gold wrist cuff (Legend of Mana storybook glove style) -->
    <path d="M18.5 23.5 L25.5 18.5 L29.2 24.2 C27.2 26.8 24.4 28.5 21.4 29.2 Z"
          fill="url(#cuffGrad)" stroke="#241309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M19.8 22.8 L25.4 19.2" stroke="#f5ce7a" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Pointing cream-gloved real hand silhouette -->
    <path d="M3.2 2.4
             C4.6 1.8 6.4 2.5 8.1 4.2
             L14.2 10.1
             C15.1 9.0 16.5 8.8 17.6 9.8
             C18.5 8.7 19.9 8.7 20.9 9.8
             C21.8 9.0 23.2 9.4 24.0 10.6
             L25.6 14.5
             C26.2 16.3 25.5 18.4 24.0 19.7
             L19.0 23.4
             C17.0 24.7 14.6 24.4 12.7 22.8
             L6.4 17.6
             C4.8 16.3 5.2 14.3 6.8 13.8
             C7.9 13.5 9.1 14.1 10.2 14.9
             L10.8 14.2
             L4.1 6.1
             C2.8 4.6 2.3 2.9 3.2 2.4 Z"
          fill="url(#gloveGrad)" stroke="#241309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Folded finger creases & knuckle shading -->
    <path d="M14.3 10.4 L16.2 13.1 M17.5 10.2 L19.1 13.0 M20.8 10.3 L22.0 12.8"
          stroke="#9c8260" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M8.6 15.8 C10.4 16.9 12.2 18.4 13.8 19.8"
          stroke="#b89f7d" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>
</svg>
