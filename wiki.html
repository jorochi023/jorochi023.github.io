<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Likha: Folklore Chronicles — Wiki &amp; Codex</title>
  <style>
    :root {
      --bg-abyss: #0c1512;
      --panel-bg: rgba(22, 35, 30, 0.95);
      --gold-bright: #f5ce7a;
      --gold-border: rgba(218, 175, 97, 0.38);
      --jade: #34d399;
      --ink: #f5efe0;
      --muted: #b3c1b8;
      --serif: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #172a23 0%, var(--bg-abyss) 70%);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      cursor: url('assets/cursor-hand.svg') 3 2, pointer;
    }

    header.wiki-topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: rgba(14, 24, 20, 0.94);
      border-bottom: 1.5px solid var(--gold-border);
    }

    .brand h1 {
      font-family: var(--serif);
      font-size: 22px;
      margin: 0;
      color: var(--gold-bright);
    }

    .brand small {
      color: var(--jade);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .toolbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    input[type="search"],
    select,
    button,
    a.back-game-btn {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink);
      background: rgba(32, 50, 42, 0.9);
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      padding: 7px 12px;
      text-decoration: none;
    }

    input[type="search"] {
      width: 240px;
      background: rgba(10, 17, 14, 0.92);
    }

    button,
    a.back-game-btn {
      cursor: url('assets/cursor-hand-point.svg') 3 2, pointer;
      font-weight: 600;
    }

    a.back-game-btn {
      background: linear-gradient(180deg, #ca9a43, #966b22);
      color: #181207;
      border-color: #f9dc92;
      font-weight: 700;
    }

    .active-chip {
      border-color: var(--gold-bright) !important;
      background: rgba(196, 149, 64, 0.28) !important;
      box-shadow: 0 0 0 1px rgba(245, 206, 122, 0.45);
    }

    .wiki-shell {
      flex: 1;
      display: grid;
      grid-template-columns: 270px 330px 1fr;
      gap: 16px;
      padding: 16px 22px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    .pane {
      background: var(--panel-bg);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    .cat-btn,
    .entry-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      padding: 9px 11px;
      background: rgba(14, 24, 20, 0.78);
    }

    .cat-btn {
      justify-content: flex-start;
    }

    .cat-icon {
      font-size: 20px;
      width: 26px;
      text-align: center;
    }

    .cat-meta strong,
    .entry-row strong {
      display: block;
      font-size: 13.5px;
      color: var(--ink);
    }

    .cat-meta small,
    .entry-row small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    .entry-row.is-locked {
      opacity: 0.6;
    }

    .tag-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--jade);
      white-space: nowrap;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .detail-header h2 {
      font-family: var(--serif);
      color: var(--gold-bright);
      margin: 0 0 4px 0;
      font-size: 24px;
    }

    .detail-sub {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .turntable-stage {
      background: rgba(10, 17, 14, 0.82);
      border: 1px solid rgba(245, 206, 122, 0.28);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    #wikiTurntable {
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 100%;
    }

    .turntable-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }

    .turntable-toolbar button {
      padding: 4px 9px;
      font-size: 11.5px;
    }

    .stats-banner {
      background: rgba(245, 206, 122, 0.12);
      border: 1px solid rgba(245, 206, 122, 0.35);
      color: var(--gold-bright);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--jade);
      margin-bottom: 4px;
    }

    .lore-prose,
    .secret-lore-card {
      background: rgba(13, 22, 18, 0.76);
      border: 1px solid rgba(218, 175, 97, 0.24);
      border-radius: 10px;
      padding: 12px 14px;
      line-height: 1.55;
      font-size: 14px;
    }

    .secret-lore-card {
      border-color: var(--jade);
      background: rgba(16, 40, 32, 0.65);
    }

    .secret-lore-card.locked-secret {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(16, 22, 20, 0.6);
      color: var(--muted);
    }

    .empty-note {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    .lom-hover-tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 280px;
      padding: 10px 12px;
      background: rgba(18, 30, 25, 0.96);
      border: 1px solid var(--gold-bright);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .lom-hover-tooltip.is-visible {
      opacity: 1;
    }

    .tip-title {
      font-family: var(--serif);
      font-weight: 700;
      color: var(--gold-bright);
      font-size: 13.5px;
    }

    .tip-sub {
      font-size: 11px;
      color: var(--jade);
      margin-top: 2px;
    }

    .tip-stats {
      font-size: 11px;
      color: #fff;
      margin-top: 4px;
    }

    .tip-body {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 1024px) {
      .wiki-shell {
        grid-template-columns: 1fr;
      }

      .pane {
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <header class="wiki-topbar">
    <div class="brand">
      <h1>LIKHA: FOLKLORE CHRONICLES — WIKI</h1>
      <small id="wikiSyncBadge">Syncing Save Chronicles...</small>
    </div>

    <div class="toolbar-controls">
      <input id="wikiSearchInput" type="search" placeholder="Search Lands, Artifacts, STs, Ores..." />
      <select id="wikiSlotSelect" title="Select Save Slot Source"></select>
      <button id="wikiModeBtn" type="button">📖 Full Reference Codex Mode</button>
      <a class="back-game-btn" href="index.html">⚔ Play Likha: Folklore Chronicles</a>
    </div>
  </header>

  <main class="wiki-shell">
    <nav id="wikiCatNav" class="pane" aria-label="Zukan Categories"></nav>
    <section id="wikiEntryList" class="pane" aria-label="Category Entries"></section>
    <article id="wikiDetailPane" class="pane" aria-label="Entry Details"></article>
  </main>

  <script src="dist/likha-wiki.js"></script>
</body>

</html>
