<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Likha: Folklore Chronicles</title>
  <style>
    :root {
      --bg-abyss: #0c1512;
      --parchment-dark: rgba(20, 31, 27, 0.92);
      --parchment-card: rgba(28, 43, 37, 0.94);
      --parchment-soft: rgba(41, 61, 52, 0.72);
      --gold-bright: #f5ce7a;
      --gold-mid: #c89d4c;
      --gold-border: rgba(218, 175, 97, 0.42);
      --jade-accent: #34d399;
      --crimson-hp: #ef4444;
      --amber-trail: #f59e0b;
      --sky-st: #38bdf8;
      --ink-light: #f5efe0;
      --ink-muted: #b6c2ba;
      --font-serif: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-abyss);
      color: var(--ink-light);
      font-family: var(--font-sans);
      cursor: url('assets/cursor-hand.svg') 3 2, pointer;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: url('assets/cursor-hand.svg') 3 2, pointer;
    }

    #hudRoot {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
    }

    #modalRoot {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    .book-panel {
      background: linear-gradient(165deg, rgba(31, 48, 41, 0.95), rgba(16, 26, 22, 0.96));
      border: 1.5px solid var(--gold-border);
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 236, 190, 0.14);
      backdrop-filter: blur(8px);
    }

    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      margin: 0 0 6px 0;
      letter-spacing: 0.02em;
      color: var(--gold-bright);
    }

    p {
      margin: 4px 0;
      line-height: 1.45;
    }

    button, .file-btn, .wiki-link-btn {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-light);
      background: rgba(40, 62, 53, 0.88);
      border: 1px solid rgba(218, 175, 97, 0.35);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: url('assets/cursor-hand-point.svg') 3 2, pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled), .file-btn:hover, .wiki-link-btn:hover {
      border-color: var(--gold-bright);
      background: rgba(58, 88, 75, 0.95);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    button.primary {
      background: linear-gradient(180deg, #ca9a43, #966b22);
      border-color: #f9dc92;
      color: #161108;
      font-weight: 700;
    }

    button.primary:hover:not(:disabled) {
      background: linear-gradient(180deg, #deb056, #ad7e2b);
    }

    .active-chip {
      border-color: var(--gold-bright) !important;
      background: rgba(196, 149, 64, 0.28) !important;
      box-shadow: 0 0 0 1px rgba(245, 206, 122, 0.45);
    }

    .sm-btn {
      padding: 4px 9px;
      font-size: 12px;
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--jade-accent);
      margin-bottom: 3px;
    }

    .muted-note {
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    input[type="text"] {
      user-select: text;
      -webkit-user-select: text;
      background: rgba(12, 20, 17, 0.9);
      border: 1px solid var(--gold-border);
      color: var(--ink-light);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 14px;
      width: 100%;
    }

    /* --- IN-GAME FIELD HUD --- */
    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .hero-status-card {
      pointer-events: auto;
      width: 300px;
      padding: 10px 12px;
    }

    .hero-header-row, .bar-label-row, .hero-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .lvl-badge {
      background: rgba(245, 206, 122, 0.2);
      border: 1px solid var(--gold-mid);
      color: var(--gold-bright);
      padding: 1px 6px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 11px;
      margin-right: 5px;
    }

    .hero-name {
      font-family: var(--font-serif);
      font-size: 15px;
      color: #fff;
    }

    .weekday-pill {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(10, 16, 14, 0.65);
    }

    .bar-track {
      position: relative;
      height: 9px;
      background: rgba(8, 12, 10, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .bar-trail {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--amber-trail);
      transition: width 0.22s ease;
    }

    .bar-fill {
      position: relative;
      height: 100%;
      transition: width 0.1s linear;
    }

    .hp-fill {
      background: linear-gradient(90deg, #dc2626, #4ade80);
    }

    .st-fill {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
    }

    .st-ready {
      background: linear-gradient(90deg, #f59e0b, #fde047) !important;
      box-shadow: 0 0 10px #fde047;
    }

    .hero-meta-row {
      color: var(--gold-bright);
      margin-top: 4px;
      font-size: 11.5px;
    }

    .ally-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .ally-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(12, 22, 18, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .ally-pill.is-down {
      border-color: #f87171;
      color: #fca5a5;
    }

    .ally-role {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--jade-accent);
    }

    .hud-center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 440px;
    }

    .location-chip {
      padding: 6px 16px;
      text-align: center;
    }

    .location-chip span {
      display: block;
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--gold-bright);
      font-size: 14px;
    }

    .location-chip small {
      color: var(--ink-muted);
      font-size: 11px;
      text-transform: capitalize;
    }

    .boss-banner {
      width: 100%;
      padding: 8px 14px;
      border-color: rgba(248, 113, 113, 0.65);
    }

    .boss-title-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #fecaca;
    }

    .boss-track {
      height: 11px;
      margin-bottom: 0;
    }

    .boss-fill {
      background: linear-gradient(90deg, #991b1b, #ef4444, #f59e0b);
    }

    .chronicle-toast {
      background: rgba(20, 35, 29, 0.95);
      border: 1px solid var(--gold-bright);
      color: var(--gold-bright);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .hud-menu-cluster {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      max-width: 320px;
    }

    .hud-btn {
      font-size: 12px;
      padding: 6px 10px;
      background: rgba(22, 36, 30, 0.9);
    }

    .interact-toast {
      pointer-events: auto;
      align-self: center;
      background: linear-gradient(180deg, #f5ce7a, #c59237);
      color: #181206;
      border-color: #fff3c4;
      font-weight: 800;
      font-size: 13.5px;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .hud-action-dock {
      pointer-events: auto;
      align-self: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background: rgba(14, 24, 20, 0.86);
      border: 1px solid var(--gold-border);
      padding: 6px 10px;
      border-radius: 12px;
    }

    .act-btn {
      flex-direction: column;
      gap: 2px;
      padding: 6px 10px;
      font-size: 15px;
      min-width: 64px;
    }

    .act-btn small {
      font-size: 9.5px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .icon-pill-btn {
      padding: 6px 9px;
      font-size: 14px;
    }

    .icon-pill-btn small {
      font-size: 10px;
      color: var(--gold-bright);
    }

    /* --- ICON-FIRST SET CARDS & FLOATING HOVER TOOLTIP --- */
    .lom-hover-tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: 296px;
      padding: 10px 12px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .lom-hover-tooltip.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tip-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 14px;
      color: var(--gold-bright);
      margin-bottom: 2px;
    }

    .tip-sub {
      font-size: 11px;
      color: var(--jade-accent);
      margin-bottom: 4px;
    }

    .tip-stats {
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      background: rgba(245, 206, 122, 0.14);
      padding: 3px 7px;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    .tip-set {
      font-size: 11.5px;
      color: #fde047;
      margin-bottom: 2px;
    }

    .tip-body {
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.38;
      margin-top: 4px;
    }

    .gear-icon-box {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      background-color: rgba(10, 18, 15, 0.85);
      border: 1px solid rgba(245, 206, 122, 0.35);
      background-repeat: no-repeat;
    }

    .weapon-icon-box {
      width: 72px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      background-color: rgba(10, 18, 15, 0.90);
      border: 1px solid rgba(245, 206, 122, 0.42);
      background-repeat: no-repeat;
    }

    .title-menu-stack {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      max-width: 310px;
      margin: 0 auto 16px auto;
    }

    .title-menu-stack button,
    .title-menu-stack a.wiki-link-btn {
      justify-content: center;
      font-size: 14.5px;
      padding: 10px 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .equip-set-card, .wpn-card {
      width: 100%;
      background: rgba(14, 24, 20, 0.84);
      border: 1px solid rgba(218, 175, 97, 0.28);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .equip-card-top, .wpn-top-row {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
    }

    .equip-card-meta {
      flex: 1;
      min-width: 0;
    }

    .equip-title-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    .equip-stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--ink-light);
    }

    .mini-chip.stat-primary {
      background: rgba(245, 206, 122, 0.16);
      border-color: rgba(245, 206, 122, 0.45);
      color: var(--gold-bright);
    }

    .temper-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: #181205;
      background: var(--gold-bright);
      padding: 0 5px;
      border-radius: 4px;
    }

    .set-bonus-strip {
      width: 100%;
      background: rgba(8, 15, 12, 0.72);
      border-radius: 6px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-top: 1px solid rgba(218, 175, 97, 0.16);
    }

    .set-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .set-line.set-dim {
      color: rgba(182, 194, 186, 0.58);
    }

    .set-line.set-active {
      color: var(--jade-accent);
      font-weight: 700;
    }

    .set-count {
      font-weight: 800;
      white-space: nowrap;
    }

    .compact-ring-grid .menu-node-card {
      align-items: center;
      justify-content: space-between;
    }

    .act-st-ready {
      border-color: #fde047 !important;
      background: rgba(234, 179, 8, 0.3) !important;
      box-shadow: 0 0 14px rgba(253, 224, 71, 0.45);
    }

    /* --- MODALS, TITLE, CREATOR, WSEL, WMAP, WORKSHOPS & ZUKAN --- */
    .modal-backdrop {
      pointer-events: auto;
      position: fixed;
      inset: 0;
      background: rgba(6, 11, 9, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .title-backdrop {
      background: radial-gradient(circle at 50% 35%, rgba(28, 52, 43, 0.52), rgba(5, 10, 8, 0.88));
    }

    .title-card {
      width: min(700px, 96vw);
      padding: 26px 28px;
      text-align: center;
    }

    .title-card h1 {
      font-size: clamp(24px, 3.6vw, 36px);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--ink-muted);
      font-size: 14px;
      max-width: 580px;
      margin: 0 auto 18px auto;
    }

    .title-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .saved-slots-box {
      text-align: left;
      background: rgba(11, 18, 15, 0.72);
      border: 1px solid rgba(218, 175, 97, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      max-height: 230px;
      overflow-y: auto;
    }

    .slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12.5px;
    }

    .slot-row:last-child {
      border-bottom: none;
    }

    .slot-row small {
      display: block;
      color: var(--ink-muted);
    }

    .empty-slot {
      color: rgba(182, 194, 186, 0.55);
    }

    .creator-modal, .wide-modal, .wmap-modal {
      width: min(980px, 96vw);
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ring-tree-modal {
      width: min(680px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 22px;
    }

    .modal-header, .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-footer {
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(218, 175, 97, 0.22);
    }

    .step-tabs, .chip-row, .inline-inputs, .pose-toolbar, .spirit-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .creator-grid, .split-2, .wsel-layout, .wmap-split {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 16px;
      align-items: start;
    }

    .creator-preview-pane, .zukan-detail-pane {
      background: rgba(12, 20, 17, 0.78);
      border: 1px solid rgba(218, 175, 97, 0.3);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #creatorTurntable, #zukanTurntable {
      border-radius: 8px;
      border: 1px solid rgba(245, 206, 122, 0.25);
      max-width: 100%;
    }

    .field-row {
      margin-bottom: 10px;
    }

    .field-row > label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--gold-bright);
      margin-bottom: 4px;
    }

    .swatch-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    .swatch-on {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--gold-bright);
      transform: scale(1.1);
    }

    .weapons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .wpn-card {
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 10px 12px;
    }

    .wpn-head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .wpn-sub {
      font-size: 11.5px;
      color: var(--jade-accent);
    }

    .wpn-card p {
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 400;
    }

    .wpn-stats {
      font-size: 11px;
      color: var(--gold-bright);
    }

    /* WSEL 19x19 & 6x6 Preview */
    .wsel-grid {
      display: grid;
      grid-template-columns: repeat(19, 18px);
      grid-template-rows: repeat(19, 18px);
      gap: 2px;
      background: #08131a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--gold-border);
      width: fit-content;
    }

    .wsel-cell {
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .wsel-land { background: #2d6a4f; }
    .wsel-coast { background: #1d4e68; }
    .wsel-dark { background: #071016; opacity: 0.35; }
    .wsel-selected {
      outline: 2px solid #fde047;
      background: #eab308 !important;
      z-index: 2;
    }

    .mask-6x6 {
      display: grid;
      grid-template-columns: repeat(6, 42px);
      grid-template-rows: repeat(6, 42px);
      gap: 4px;
    }

    .mask-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .m-land { background: rgba(45, 106, 79, 0.72); }
    .m-water { background: rgba(24, 78, 104, 0.72); }

    /* MENU Node Tree */
    .menu-nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin: 10px 0;
    }

    .menu-node-card {
      text-align: left;
      align-items: flex-start;
      padding: 10px 12px;
    }

    .node-icon {
      font-size: 20px;
      line-height: 1;
    }

    /* WMAP 6x6 Land Make */
    .wmap-6x6 {
      display: grid;
      grid-template-columns: repeat(6, 78px);
      grid-template-rows: repeat(6, 78px);
      gap: 6px;
      margin-bottom: 10px;
    }

    .wmap-cell {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .wmap-cell.empty-land { background: rgba(36, 77, 58, 0.55); }
    .wmap-cell.empty-water { background: rgba(20, 58, 82, 0.55); }
    .wmap-cell.can-place {
